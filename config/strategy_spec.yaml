hypotheses:
  main: [H1, H2, H3, H4]
  exploratory: [E1, E2, E3]
  baselines: [B1, B2, B3, B4]
inference:
  seed: 20260421
  bootstrap_reps: 10000
  permutation_reps: 10000
  newey_west_lags: 5
  alpha: 0.05
acceptance:                 # aplicada solo en la prueba final, caso de costos base
  A1_holm_p_max: 0.05
  A2_sharpe_min: 0.5
  A3_stress_sharpe_min_exclusive: 0.0
  A4_permutation_p_max: 0.05
  A6_min_fraction_positive_years: 0.5
annualization_days: 252
