# Especificación pre-registrada de la estrategia (Gao, Han, Li y Zhou, JFE 2018).
timezone: "America/New_York"
calendar: "XNYS"
bars:                       # etiqueta = inicio de la barra de 1 minuto en hora ET
  first_half_hour_close: "09:59"
  r12_open: "15:00"
  r12_close: "15:29"
  entry_open: "15:30"
  exit_close: "15:59"
  prev_close: "15:59"       # del día hábil anterior, mismo contrato
  vol_window_start: "09:30"
  vol_window_end: "09:59"
critical_bars: ["09:59", "15:00", "15:29", "15:30", "15:59"]
volatility:
  min_bars_in_window: 20     # mínimo de barras de 1 min en 09:30-09:59 para calcular la volatilidad
